# Harbor work-pipeline. `harbor init` copies this package into
# <repo>/.harbor/workflow/. Edit your copy to change the dev workflow.
# Role models live in config.toml beside this file.
version = 1

[delivery]
# "human": a person merges. "workflow_checked" lets pre_merge readiness allow
# automatic merges for the risks listed below.
merge_mode = "human"
auto_merge_risks = []

[github]
# How the builder reads and writes GitHub. "rest" (default) uses Harbor's
# built-in helper with your GITHUB_TOKEN/GH_TOKEN. "mcp" (Claude builders only)
# adds a GitHub MCP server; set mcp_url for GitHub Enterprise Server.
transport = "rest"

[recovery]
# Automatic retries after an unexpected builder exit.
enabled = true
delays_seconds = [30, 120, 300]
max_attempts = 3

[decisions]
# How First Mate may answer blockers: human | cite_only | bounded.
mode = "cite_only"
require_citation = true
require_rationale = true
# When a blocked builder recommends the FIRST of its options, Harbor records
# that option as the answer and resumes the builder (default on; mode = "human"
# turns it off). Pure decisions in plain prose only; never for protected paths
# or twice for the same question, and never a merge authorization. Money,
# deletion, credential and gate exclusions are best-effort keyword heuristics,
# so set false if product decisions here carry cost or data risk.
# auto_accept_first_option = true
# max_auto_accepts = 2        # per builder run, 0-10

[cleanup]
mode = "after_merge"
delay_seconds = 0

[evidence]
# Readiness evidence: required | advisory | off.
ci = "required"
feedback = "advisory"

[skills.delivery]
ref = "skills/delivery/SKILL.md"
[skills.planning]
ref = "skills/planning/SKILL.md"
[skills.review]
ref = "skills/review/SKILL.md"
[skills.risk]
ref = "skills/risk/SKILL.md"
[skills.blocker_assessment]
ref = "skills/blocker-assessment/SKILL.md"

[hooks.handoff]
event = "pre_handoff"
mode = "required"
executor = "script"
command = ["python3", "scripts/readiness.py"]
protocol = "json"
timeout_seconds = 60

[hooks.readiness]
event = "pre_merge"
mode = "required"
executor = "script"
command = ["python3", "scripts/readiness.py"]
protocol = "json"
timeout_seconds = 60

[hooks.decision_policy]
event = "blocker"
mode = "required"
executor = "script"
command = ["python3", "scripts/decision_policy.py"]
protocol = "json"
timeout_seconds = 15

# Optional repository checks the delivery skill can run with
# `harbor workflow checks PROJECT --ticket ID --parallel`.
# [checks.tests]
# command = ["pnpm", "test"]
# required = true
# timeout_seconds = 600
